# Argus - nginx server block configuration
# Domain: argus.<domain> (placeholder; replace with actual subdomain)
# Proxies public HTTPS -> uvicorn 127.0.0.1:8090 (Streamable HTTP MCP)
# TLS managed by certbot (LetsEncrypt renewal automatic)
# Reference: docs/00-DESIGN.md sec  9 (Deploy topology)

# Redirect HTTP -> HTTPS (best practice, security)
server {
    listen 80;
    listen [::]:80;
    server_name argus.<domain>;

    # Certbot will write the challenge here during renewal
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    # All other traffic -> HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name argus.<domain>;

    # ====================================================================
    # TLS Configuration (certbot-managed)
    # ====================================================================
    # After running provision.sh, certbot will populate these paths.
    # Paths are standard certbot locations; nginx reloads on renewal (auto).
    ssl_certificate /etc/letsencrypt/live/argus.<domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/argus.<domain>/privkey.pem;

    # Strong TLS settings (modern clients, A+ rating)
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/argus.<domain>/chain.pem;

    # HSTS: clients remember to use HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ====================================================================
    # Security Headers
    # ====================================================================
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Disable MIME-type sniffing (prevent content-type injection)
    add_header X-Content-Type-Options "nosniff" always;

    # Enable XSS filter in older browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # ====================================================================
    # Logging
    # ====================================================================
    access_log /var/log/nginx/argus_access.log;
    error_log /var/log/nginx/argus_error.log warn;

    # ====================================================================
    # MCP HTTP Stream Endpoint: /mcp
    # ====================================================================
    # Streamable HTTP MCP (Server-Sent Events style, long-lived connections).
    # CRITICAL settings:
    #   - proxy_buffering off : don't buffer SSE frames (real-time streaming)
    #   - proxy_read_timeout 300s : allow slow reads (long scrapes, browser waits)
    #   - proxy_request_buffering off : don't buffer client request body
    #   - Connection/Upgrade headers for potential WebSocket upgrade (future-proofing)
    location /mcp {
        # Authentication: verify Authorization header is present and valid.
        # Clients MUST send: Authorization: Bearer <ARGUS_TOKEN>
        # The token is checked in fastmcp StaticTokenVerifier (server-side).
        # Optional: add a second layer here (nginx basic-auth, IP allowlist).
        # See commented examples below.

        # Proxy to uvicorn backend
        proxy_pass http://127.0.0.1:8090;

        # ============================================================
        # Stream settings (critical for Streamable HTTP MCP)
        # ============================================================
        # Disable buffering so the client sees frames as they're generated
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts: scrapes can be slow (JS render, deep crawl, PDFs)
        proxy_connect_timeout 10s;      # Time to establish TCP connection
        proxy_read_timeout 300s;        # Time to read the full response (5 min)
        proxy_send_timeout 30s;         # Time to send the request

        # Pass headers as-is
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Pass Authorization header to backend (for bearer token verification)
        proxy_pass_header Authorization;

        # HTTP/1.1 upgrade support (for potential WebSocket upgrade, Connection: upgrade)
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # ============================================================
        # OPTIONAL: Second-layer auth / IP restrictions
        # ============================================================
        # Uncomment to restrict access by IP (e.g., office network only).
        # This prevents external brute-force attacks on the bearer token.
        # allow <office-ip>;
        # allow <another-office-ip>;
        # deny all;
    }

    # ====================================================================
    # Health Check Endpoint: /health
    # ====================================================================
    # Unauthenticated (allows monitoring agents to poll without bearer token).
    # Used by Hermes watchdog (/30 min cron) and Prometheus.
    # Returns HTTP 200 + JSON {status: "ok"} if browser pool is alive.
    location /health {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        access_log off;  # Don't log /health to reduce noise
    }

    # ====================================================================
    # Metrics Endpoint: /metrics
    # ====================================================================
    # Prometheus format (OpenMetrics). NOTE: /metrics and /health are FastMCP custom routes
    # and are NOT behind the bearer-token verifier - so they are restricted at nginx instead.
    # Default: loopback only. Add your monitoring/Prometheus server IP explicitly.
    location /metrics {
        allow 127.0.0.1;
        # allow <PROMETHEUS_SERVER_IP>;   # uncomment + set for remote scraping
        deny all;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }

    # ====================================================================
    # Deny access to everything else
    # ====================================================================
    location / {
        return 404;
    }
}

# ====================================================================
# DEPLOYMENT NOTES
# ====================================================================
# 1. Replace "argus.<domain>" with the actual subdomain (e.g., argus.suriota.com)
# 2. Run certbot to generate TLS certs:
# certbot certonly --webroot -w /var/www/letsencrypt -d argus.<domain>
# 3. Reload nginx:
# nginx -t && systemctl reload nginx
# 4. Test SSL via: https://www.ssllabs.com/ssltest/ (expect A+)
# 5. Verify streaming works:
# curl -H "Authorization: Bearer <ARGUS_TOKEN>" https://argus.<domain>/health
# 6. Set up certbot renewal cron (certbot handles this automatically on Debian/Ubuntu).
#
# OPTIONAL: Second-layer auth / IP filtering
# ===========================================
# If you want to restrict /mcp access beyond the bearer token (e.g., office IPs only):
# 1. Uncomment the "allow <ip>" / "deny all" lines in the /mcp location.
# 2. Add your office IP addresses.
# 3. Example: if your office is 203.0.113.0/24, add "allow 203.0.113.0/24;".
# 4. Reload: systemctl reload nginx
#
# OPTIONAL: nginx basic auth (username/password on top of bearer token)
# =========================================================================
# Rarely needed (bearer token is already strong), but if you want it:
# 1. Create a htpasswd file:
# htpasswd -c /etc/nginx/.htpasswd_argus username
# 2. Uncomment in the /mcp location:
# auth_basic "Argus MCP";
# auth_basic_user_file /etc/nginx/.htpasswd_argus;
# 3. Clients will need to pass both basic auth + Authorization header.
#
# Performance tuning (if needed):
# ================================
# Increase proxy_buffers if you see "502 Bad Gateway" on large responses:
# proxy_buffering off;  <- already set; don't change for streaming
# For non-streaming endpoints, you could set:
# proxy_buffering on;
# proxy_buffer_size 4k;
# proxy_buffers 8 4k;
# proxy_busy_buffers_size 8k;

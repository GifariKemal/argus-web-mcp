# Argus MCP - fail2ban filter
# Install to: /etc/fail2ban/filter.d/argus-mcp.conf
# Matches a failed bearer-auth attempt: 401 on /mcp in nginx "combined" access log.
# argus.gifariksuryo.xyz is DNS-only (grey-cloud), so <HOST> is the real client IP.
[Definition]
failregex = ^<HOST> -.*"(?:GET|POST|PUT|PATCH|DELETE|HEAD) /mcp(?:\?\S*)? HTTP/[^"]*" 401
ignoreregex =

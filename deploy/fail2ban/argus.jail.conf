# Argus MCP - fail2ban jail
# Install to: /etc/fail2ban/jail.d/argus.conf
# Bans IPs that fail bearer auth (401 on /mcp) 5 times within 10 min, for 24h.
# Inherits banaction from [DEFAULT] in jail.conf (same backend as nginx-http-auth).
# No inline comments after values: fail2ban's parser would fold them into the value.
[argus-mcp]
enabled  = true
port     = http,https
filter   = argus-mcp
# The host default is "backend = systemd" (reads journald); nginx writes a FILE,
# so force file polling or this jail would silently match nothing.
backend  = polling
logpath  = /var/log/nginx/argus_access.log
maxretry = 5
findtime = 600
bantime  = 86400

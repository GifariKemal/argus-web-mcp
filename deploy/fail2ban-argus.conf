# fail2ban - Argus MCP jail configuration
# Protects against bearer token brute-force attacks on nginx.
# Reference: docs/00-DESIGN.md sec  6 (Security, hard gates)

# ====================================================================
# fail2ban FILTER: nginx-argus-bearer-401
# ====================================================================
# Matches failed authentication (401 Unauthorized) on /mcp endpoint.
# Pattern: client IP + 401 in the nginx access log.
# fail2ban will extract the IP and block it after N failures within window T.

[Definition]
failregex = ^<HOST> .* "(?:GET|POST|PUT|PATCH|DELETE) /mcp HTTP/.*" 401 .*$
ignoreregex =

# Example nginx log line (access.log):
# 203.0.113.1 - - [24/Jun/2026:10:30:45 +0000] "POST /mcp HTTP/1.1" 401 0 "-" "curl/7.68.0"
# ^<HOST> matches the IP (203.0.113.1), followed by the rest of the log.
# The regex captures lines ending with " 401 " (the HTTP status).

# ====================================================================
# fail2ban JAIL: argus
# ====================================================================
# Applies the above filter to nginx logs and blocks IPs that exceed the threshold.

[jail:argus]
enabled = true
port = http,https
filter = nginx-argus-bearer-401
logpath = /var/log/nginx/argus_access.log
maxretry = 5               # Block after 5 failed 401s (tightened vs bearer brute-force)
findtime = 600             # Within a 10-minute window (600 seconds)
bantime = 86400            # Ban for 24h (tightened: no legit client should 401-loop)

# Action: add firewall rule (ufw or iptables).
# Default action is "%(action_mwl)s" which sends email + blocks IP.
# We use "%(action_multi)s" for multiple blocking backends (iptables + ufw if available).
action = %(action_multi)s

# Optional: send email alerts (requires postfix/mail configured).
# Uncomment to enable:
# action = %(action_mwl)s
# destemail = admin@suriota.com
# sendername = fail2ban

# ====================================================================
# NOTES
# ====================================================================
# 1. Install fail2ban (if not already present):
# apt update && apt install -y fail2ban
#
# 2. Place this file at:
# /etc/fail2ban/jail.d/argus.conf
#
# 3. Enable and start fail2ban:
# systemctl enable fail2ban
# systemctl start fail2ban
#
# 4. Reload the config (after changes):
# fail2ban-client reload
# Or restart the service:
# systemctl restart fail2ban
#
# 5. Check jail status:
# fail2ban-client status
# fail2ban-client status argus
#
# 6. View failed attempts in real-time:
# tail -f /var/log/nginx/argus_access.log | grep " 401 "
#
# 7. Manually unban an IP (if locked out):
# fail2ban-client set argus unbanip <IP>
# Example:
# fail2ban-client set argus unbanip 203.0.113.1
#
# 8. To verify the filter is working, test a 401 manually:
# curl -i https://argus.<domain>/mcp
# (Should return 401 because no Authorization header was sent.)
# Repeat 11 times in <10 min, IP should get banned by fail2ban.
#
# 9. Monitor ban status (if monitoring agent is configured):
# iptables -L -n | grep <IP>  # See if IP is in iptables rules
# ufw status | grep <IP>       # Or check ufw (if enabled)
#
# 10. Tuning:
# - Lower maxretry (e.g., 5) for stricter protection, higher for tolerance of typos.
# - Increase bantime (e.g., 86400) for longer bans.
# - Decrease findtime for a tighter window (e.g., 300 = 5 min).
# - In production, also monitor your own office IPs to avoid self-banning.
# If you suspect a false positive, check the logs:
# grep "<OFFICE-IP>" /var/log/nginx/argus_access.log | tail
#
# INTEGRATION WITH HERMES (MONITORING)
# ====================================
# The Hermes watchdog can optionally monitor fail2ban jail status:
# fail2ban-client status argus | grep "Banned IP list" | wc -l
# If banned IPs > threshold, trigger an alert or escalation.
# This ensures suspicious activity is caught and logged centrally.

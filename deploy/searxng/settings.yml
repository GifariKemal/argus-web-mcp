# SearXNG settings for Argus - minimal, JSON-API enabled, loopback-bound.
# Full reference: https://docs.searxng.org/admin/settings/index.html
# Keep the upstream defaults, minus the onion engines: they need a tor proxy this
# instance does not have, and without one they log "can't register engine" at every start.
use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

general:
  instance_name: "argus-search"
  # No public stats/metrics surface.
  enable_metrics: false

search:
  # CRITICAL: enable JSON so Argus can call ?format=json. html kept for debugging.
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  # Shorten SearXNG penalty box so one throttled burst does not bench an engine for hours
  # (root cause of the ddg-only concentration). Private loopback instance (limiter:false).
  suspended_times:
    SearxEngineCaptcha: 900
    SearxEngineTooManyRequests: 300
    SearxEngineAccessDenied: 900
    recaptcha_SearxEngineCaptcha: 3600

server:
  # Inside the container SearXNG listens on 0.0.0.0:8080; the compose port mapping
  # (127.0.0.1:8888:8080) is what enforces loopback-only exposure on the host.
  bind_address: "0.0.0.0"
  port: 8080
  # MUST be replaced before first run - provision.sh does this automatically:
  #   sed -i "s/CHANGE_ME_GENERATE_RANDOM/$(openssl rand -hex 32)/" settings.yml
  secret_key: "CHANGE_ME_GENERATE_RANDOM"
  limiter: false           # no bot-limiter: only Argus (a trusted local client) hits it.
  public_instance: false
  image_proxy: false
  method: "GET"

# Give flaky/free upstream engines a little more room before they're marked unresponsive.
outgoing:
  # Engines that block this host's IP range route through `network: proxied` below.
  # The target is a compose service, not a provider URL, so no credentials ever land in
  # this repo: `docker-compose.proxy.yml` runs that service and reads the upstream URL
  # from its env. With no proxy service running, nothing requests these engines - the
  # fan-out is chosen by ARGUS_SEARCH_ENGINES, which omits them by default.
  networks:
    proxied:
      proxies: socks5h://proxy:1080
  request_timeout: 6.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
  retries: 1
  # PROXY POOL (owner-chosen reliability strategy). The big free engines (brave/google/ddg)
  # rate-limit/CAPTCHA per source IP; routing SearXNG's OUTBOUND engine requests through a
  # rotating proxy pool spreads load across IPs so they don't throttle. Uncomment + fill with
  # your real proxies (http/https/socks5), or have provision.sh inject them from $ARGUS_SEARXNG_PROXIES.
  # proxies:
  #   all://:
  #     - socks5h://user:pass@proxy-a.example:1080
  #     - socks5h://user:pass@proxy-b.example:1080
  #     - http://user:pass@proxy-c.example:8080

# Broadened engine set (owner-chosen): mix throttle-prone majors with low-friction engines so
# a query still returns results when brave/google/ddg are temporarily suspended. use_default_settings
# keeps the rest; these entries (re)enable the resilient ones for the general category.
# Blocked or unreachable from the SURIOTA VPS (Tencent datacenter IP), verified
# 2026-09-15 with a fresh suspension state: mojeek never answers (25 s with no response
# at all), duckduckgo returns a CAPTCHA instantly, qwant returns access denied. Leaving
# them on costs a 6 s timeout per search and an ERROR line per query, and returns
# nothing. Re-enable them behind a residential proxy or on a different network.
# `startpage` and `marginalia` used to be listed here. Upstream SearXNG no longer ships
# either engine (this image exposes 264 engines and neither is among them), and SearXNG
# silently DROPS an unknown name from `engines=` and answers from its default set instead,
# so they looked healthy while contributing nothing. Verified against /config, not guessed.
engines:
  - name: mojeek
    disabled: true
    network: proxied
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: true
    network: proxied
  - name: brave
    disabled: false
  - name: qwant
    disabled: true
    network: proxied
  - name: wikipedia
    disabled: false
  # Shipped disabled by SearXNG, but measured usable from THIS host on 2026-09-18 (two
  # queries each, results checked by attribution): google 10 results/query at 0.2 s,
  # duckduckgo web 10 at 0.7 s, yandex 15 at 1.0 s. Four independent crawls beside bing
  # and brave, which matters because a three-engine fan-out has no slack when one
  # throttles. Note `duckduckgo web` answers while plain `duckduckgo` is CAPTCHA-blocked,
  # the same split as `duckduckgo news`.
  - name: google
    disabled: false
  - name: duckduckgo web
    disabled: false
  - name: yandex
    disabled: false
  # Also measured usable and deliberately left off: zapmeta (9/query), resulthunter (20),
  # reloado (16), yahoo (7). They are aggregators or bing re-servers, so they add
  # duplicates rather than a new crawl. Enable them if the fan-out ever needs padding.
  # Dead from this IP: seznam, mwmbl, yacy (timeout); yep, privacywall, fireball,
  # searchmysite, fastbot, tusksearch (access denied); crowdview, encyclosearch, wiby.
  # Times out on nearly every query from this host (measured 2026-09-18: the only engine
  # errors in the production log were wikidata timeouts). It is a fact lookup, not a web
  # index, so nothing is lost by keeping it out of the fan-out.
  - name: wikidata
    disabled: true

  # Category engines, measured from this host on 2026-09-18 with two on-topic queries
  # each (an off-topic zero proves nothing for a narrow index). Every engine below either
  # reported an explicit error or returned nothing for a query it must know, so each one
  # only costs a failed sub-request per search. Everything not listed here answered and
  # stays on: bing news, brave.news, duckduckgo news, google news, wikinews, arxiv,
  # europepmc, semantic scholar, pdbe, github, stackoverflow, docker hub, mdn, askubuntu,
  # superuser, hoogle, mankier. Note `duckduckgo news` works from this IP even though
  # plain `duckduckgo` is CAPTCHA-blocked - they are separate engines upstream.
  - name: reuters          # HTTP error, then suspended
    disabled: true
  - name: pubmed           # "unexpected crash" inside the engine
    disabled: true
  - name: openairepublications  # 5 s timeout, every query
    disabled: true
  - name: openairedatasets      # 5 s timeout, every query
    disabled: true
  - name: gentoo           # HTTP connection error
    disabled: true
  - name: pypi             # zero results for "httpx" and "pydantic"
    disabled: true
  - name: arch linux wiki  # zero results for "systemd" and "pacman"
    disabled: true
  # Blocked by IP like the three above, so it points at the same proxy path: if a proxy
  # ever runs, it comes back by moving this to `disabled: false`.
  - name: google scholar   # access denied from this datacenter IP
    disabled: true
    network: proxied

ui:
  static_use_hash: true

# RELIABILITY NOTE (validated live 2026-06-24): on a single IP the big free engines
# (brave/google/ddg/startpage) rate-limit/CAPTCHA after a burst -> SearXNG returns 0 results
# with `unresponsive_engines` set, which Argus `search` surfaces as RETRYABLE search_backend_down.
# Mitigation here = broad engine set (above) + outbound proxy pool (outgoing.proxies). Datacenter
# IPs throttle FASTER than residential, so the proxy pool matters most on the VPS.

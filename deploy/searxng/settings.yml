# SearXNG settings for Argus - minimal, JSON-API enabled, loopback-bound.
# Full reference: https://docs.searxng.org/admin/settings/index.html
# Keep the upstream defaults, minus the onion engines: they need a tor proxy this
# instance does not have, and without one they log "can't register engine" at every start.
use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

general:
  instance_name: "argus-search"
  # No public stats/metrics surface.
  enable_metrics: false

search:
  # CRITICAL: enable JSON so Argus can call ?format=json. html kept for debugging.
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  # Shorten SearXNG penalty box so one throttled burst does not bench an engine for hours
  # (root cause of the ddg-only concentration). Private loopback instance (limiter:false).
  suspended_times:
    SearxEngineCaptcha: 900
    SearxEngineTooManyRequests: 300
    SearxEngineAccessDenied: 900
    recaptcha_SearxEngineCaptcha: 3600

server:
  # Inside the container SearXNG listens on 0.0.0.0:8080; the compose port mapping
  # (127.0.0.1:8888:8080) is what enforces loopback-only exposure on the host.
  bind_address: "0.0.0.0"
  port: 8080
  # MUST be replaced before first run - provision.sh does this automatically:
  #   sed -i "s/CHANGE_ME_GENERATE_RANDOM/$(openssl rand -hex 32)/" settings.yml
  secret_key: "CHANGE_ME_GENERATE_RANDOM"
  limiter: false           # no bot-limiter: only Argus (a trusted local client) hits it.
  public_instance: false
  image_proxy: false
  method: "GET"

# Give flaky/free upstream engines a little more room before they're marked unresponsive.
outgoing:
  # Engines that block this host's IP range route through `network: proxied` below.
  # The target is a compose service, not a provider URL, so no credentials ever land in
  # this repo: `docker-compose.proxy.yml` runs that service and reads the upstream URL
  # from its env. With no proxy service running, nothing requests these engines - the
  # fan-out is chosen by ARGUS_SEARCH_ENGINES, which omits them by default.
  networks:
    proxied:
      proxies: socks5h://proxy:1080
  request_timeout: 6.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
  retries: 1
  # PROXY POOL (owner-chosen reliability strategy). The big free engines (brave/google/ddg)
  # rate-limit/CAPTCHA per source IP; routing SearXNG's OUTBOUND engine requests through a
  # rotating proxy pool spreads load across IPs so they don't throttle. Uncomment + fill with
  # your real proxies (http/https/socks5), or have provision.sh inject them from $ARGUS_SEARXNG_PROXIES.
  # proxies:
  #   all://:
  #     - socks5h://user:pass@proxy-a.example:1080
  #     - socks5h://user:pass@proxy-b.example:1080
  #     - http://user:pass@proxy-c.example:8080

# Broadened engine set (owner-chosen): mix throttle-prone majors with low-friction engines so
# a query still returns results when brave/google/ddg are temporarily suspended. use_default_settings
# keeps the rest; these entries (re)enable the resilient ones for the general category.
# Blocked or unreachable from the SURIOTA VPS (Tencent datacenter IP), verified
# 2026-09-15 with a fresh suspension state: mojeek never answers (25 s with no response
# at all), duckduckgo returns a CAPTCHA instantly, qwant returns access denied. Leaving
# them on costs a 6 s timeout per search and an ERROR line per query, and returns
# nothing. Re-enable them behind a residential proxy or on a different network.
engines:
  - name: mojeek
    disabled: true
    network: proxied
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: true
    network: proxied
  - name: brave
    disabled: false
  - name: qwant
    disabled: true
    network: proxied
  - name: startpage
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
  - name: marginalia
    disabled: false

ui:
  static_use_hash: true

# RELIABILITY NOTE (validated live 2026-06-24): on a single IP the big free engines
# (brave/google/ddg/startpage) rate-limit/CAPTCHA after a burst -> SearXNG returns 0 results
# with `unresponsive_engines` set, which Argus `search` surfaces as RETRYABLE search_backend_down.
# Mitigation here = broad engine set (above) + outbound proxy pool (outgoing.proxies). Datacenter
# IPs throttle FASTER than residential, so the proxy pool matters most on the VPS.

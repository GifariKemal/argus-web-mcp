# Bot-detection config for SearXNG. `limiter: false` in settings.yml means none of this
# is enforced (only Argus, a trusted local client, reaches this instance), but the
# botdetection module reads this file at startup and warns when it is missing.
[real_ip]
x_for = 1
ipv4_prefix = 32
ipv6_prefix = 48

[botdetection.ip_limit]
link_token = false

[botdetection.ip_lists]
pass_ip = []
block_ip = []

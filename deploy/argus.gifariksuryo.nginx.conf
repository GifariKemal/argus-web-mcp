# Argus MCP - argus.gifariksuryo.xyz (DNS-only / grey-cloud -> 127.0.0.1:8090)
server {
    listen 80;
    listen [::]:80;
    server_name argus.gifariksuryo.xyz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }
    location / { return 301 https://$server_name$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name argus.gifariksuryo.xyz;

    ssl_certificate     /etc/letsencrypt/live/argus.gifariksuryo.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/argus.gifariksuryo.xyz/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Compress the (often large, full-content) JSON tool responses over the wire. Only
    # engages when the client sends Accept-Encoding: gzip (httpx/Claude Code do); no-op
    # otherwise. Works with `proxy_buffering off` (compresses per-chunk as it streams).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/json-rpc text/plain text/xml application/xml;

    access_log /var/log/nginx/argus_access.log;
    error_log  /var/log/nginx/argus_error.log warn;

    # MCP streamable-HTTP: no buffering, long read timeout for scrapes/crawls
    location /mcp {
        proxy_pass http://127.0.0.1:8090;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Authorization;
    }

    location /health {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        access_log off;
    }

    location /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}

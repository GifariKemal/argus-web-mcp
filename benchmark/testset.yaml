# =============================================================================
# Argus Benchmark Test-Set Specification  /  benchmark/testset.yaml
# =============================================================================
# PURPOSE: reference-based benchmark for Argus vs 12 incumbent tools. 7 fetch/
# scrape categories (~30 URLs) + 10 search queries. Each tool runs every item;
# outputs scored vs hand-curated gold references.
#
# SCOPE NOTE (owner directive 2026-06-24): Argus is GENERAL-PURPOSE - it must
# serve ALL SURIOTA domains (firmware/ESP32, trading/Aurix, web, business docs,
# AI servers) AND general web research (the broad "12 use cases"). This seed
# testset leans trading (the moat) + general docs/news; **P1 MUST enrich** with
# non-trading SURIOTA domains: ESP-IDF/ESP32 docs, MQL5/MetaTrader docs, Flutter,
# FastAPI/Node, business/market-research sources, and broader general queries.
#
# gold_reference: "TBD-curate-in-P1" -> human curates canonical clean extraction
# in P1 (inline string OR path gold/<id>.md). Search queries store ranked gold
# URL list for nDCG. Until curated, scorers compute only reference-free signals.
#
# METRICS: rouge_l, token_f1, success, truncation, latency(p50/p95),
# table_fidelity (pdf/trading), search_ndcg_10, cost (USD/call -> cost/success).
# URLs verified live 2026-06-24; volatile items (news/calendars) should be
# HTML/PDF-snapshotted alongside the gold ref in P1.
# =============================================================================

meta:
  name: argus-benchmark

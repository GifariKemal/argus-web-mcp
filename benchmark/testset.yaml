# =============================================================================
# Argus Benchmark Test-Set Specification  /  benchmark/testset.yaml
# =============================================================================
# PURPOSE: reference-based benchmark for Argus vs 12 incumbent tools. Fetch/
# scrape categories + search queries. Each tool runs every item;
# outputs scored vs hand-curated gold references.
#
# SCOPE NOTE: active benchmark scope is non-trading. Trading/Aurix/MQL5 cases are
# intentionally excluded from this harness unless a run explicitly restores them.
#
# gold_reference: "TBD-curate-in-P1" -> human curates canonical clean extraction
# in P1 (inline string OR path gold/<id>.md). Search queries store ranked gold
# URL list for nDCG. Until curated, scorers compute only reference-free signals.
#
# METRICS: rouge_l, token_f1, success, truncation, latency(p50/p95),
# table_fidelity (pdf), search_ndcg_10, cost (USD/call -> cost/success).
# URLs verified live 2026-06-24; volatile items (news/calendars) should be
# HTML/PDF-snapshotted alongside the gold ref in P1.
# =============================================================================

meta:
  name: argus-benchmark
  version: "0.1.0-spec"
  created: "2026-06-24"
  incumbent_tools: 12
  url_count: 16
  search_query_count: 8
  gold_status: "partial-curated-P1 (4 active stable text items have gold/<id>.md; rest TBD)"
  p1_todo: "DONE 2026-06-24 - added ESP-IDF/Flutter/FastAPI docs + 2 market-research longform + 3 broad general queries; curated gold remains active for longform-04, longform-03, docs-01, docs-03 after trading-scope removal."


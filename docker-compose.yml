# Argus in Docker. Two consumers:
#   local     `docker compose up -d` -> MCP at http://127.0.0.1:8090/mcp, no auth
#             (ARGUS_TOKEN empty) because the published port is loopback-only.
#   Easypanel Compose service on the VPS -> Traefik routes the public domain to
#             the `argus` service on 8090, and ARGUS_TOKEN is set there, so the
#             public endpoint requires a bearer token.
services:
  searxng:
    image: searxng/searxng:latest
    container_name: argus-searxng
    restart: unless-stopped
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      # SEARXNG_SECRET overrides server.secret_key from settings.yml. The default
      # only ever applies to the loopback-only local stack; the Easypanel deploy
      # sets a real random value in its service env.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-local-loopback-only-not-a-real-secret}
    # ponytail: no host port - only Argus talks to it, over the compose network.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  argus:
    build: .
    container_name: argus
    restart: unless-stopped
    depends_on: [searxng]
    ports:
      - "127.0.0.1:8090:8090"   # loopback only - never expose this
    environment:
      - ARGUS_SEARXNG_URL=http://searxng:8080
      # Empty locally (loopback-only, no auth); the Easypanel deploy sets a real
      # token in its service env because there the endpoint is public.
      - ARGUS_TOKEN=${ARGUS_TOKEN:-}
    shm_size: 1gb               # Chromium crashes on the default 64m
    volumes:
      - argus-cache:/root/.argus
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 30s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  argus-cache:

[project]
name = "argus"
version = "0.4.27"
description = "Argus - SURIOTA self-hosted web fetch/scrape/search MCP server"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastmcp>=4.0.10,<5",
    "crawl4ai>=0.9.0",
    "trafilatura>=2.0",
    "readability-lxml>=0.8.1",
    "markdownify>=0.13",
    "httpx>=0.27",
    # >=1.28: it pulls pymupdf-layout, whose 1.27.x builds were PolyForm NonCommercial;
    # 1.28.x is AGPL-3.0 like pymupdf itself. Exact versions live in requirements.lock.
    "pymupdf4llm>=1.28",
    "parsel>=1.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "instructor>=1.5",
    "openai>=1.40",
]

[project.optional-dependencies]
# Heavy ML stack (torch etc.) - only the quality PDF tier. pymupdf4llm is the default path.
pdf-quality = ["docling>=2.0"]
# Local semantic search/rerank + find_similar. ONNX-based (no torch), small model cached on first use.
semantic = ["fastembed>=0.4", "numpy>=1.26"]
# HTTP serving (the Docker image); stdio use needs nothing extra.
serve = ["uvicorn>=0.30"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
# S101: asserts allowed. ASYNC109: we forward `timeout` to httpx/crawl4ai by design.
ignore = ["S101", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "browser: needs a real Chromium (Playwright/Crawl4AI)",
    "slow: heavy model download (Docling)",
    "network: hits the live internet",
]

[tool.coverage.run]
source = ["argus"]
branch = true

[project]
name = "argus"
version = "0.4.3"
description = "Argus - SURIOTA self-hosted web fetch/scrape/search MCP server"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastmcp>=2.11",
    "crawl4ai>=0.9.0",
    "trafilatura>=2.0",
    "readability-lxml>=0.8.1",
    # NOTE: lxml is held at <6 by crawl4ai 0.9.0 (latest). lxml 5.4.0 carries PYSEC-2026-87
    # (XXE/local-file-read), but it is NOT reachable here: Argus only parses HTML
    # (parsel Selector(text=...) HTML mode, lxml.html via readability/trafilatura) - no
    # untrusted-XML parse with entity resolution. Bump to >=6.1.0 when crawl4ai relaxes the pin.
    "markdownify>=0.13",
    "httpx>=0.27",
    "pymupdf4llm>=0.0.17",
    "parsel>=1.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "instructor>=1.5",
    "openai>=1.40",
]

[project.optional-dependencies]
# Heavy ML stack (torch etc.) - only the quality PDF tier. pymupdf4llm is the default path.
pdf-quality = ["docling>=2.0"]
# Local semantic search/rerank + find_similar. ONNX-based (no torch), small model cached on first use.
semantic = ["fastembed>=0.4", "numpy>=1.26"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
# S101: asserts allowed. ASYNC109: we forward `timeout` to httpx/crawl4ai by design.
ignore = ["S101", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "browser: needs a real Chromium (Playwright/Crawl4AI)",
    "slow: heavy model download (Docling)",
    "network: hits the live internet",
]

[tool.coverage.run]
source = ["argus"]
branch = true
